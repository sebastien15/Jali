  /admin/rentals/{id}:
    parameters:
      - $ref: "#/components/parameters/RentalBookingId"
    get:
      tags: [Admin rentals]
      operationId: getAdminRental
      x-jali-story: S24.9
      x-jali-permission: manage-rentals
      summary: A rental with contacts, records and ratings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentalBooking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token from `/auth/login` or `/auth/login/google`.

  parameters:
    RentalCarId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    RentalBookingId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    PhotoIndex:
      name: index
      in: path
      required: true
      description: Position in the photos list, from 0
      schema: { type: integer, minimum: 0 }
    RentalDocumentType:
      name: type
      in: path
      required: true
      schema: { type: string, enum: [registration, insurance] }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: integer }
    DocumentId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    VehicleId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    HireId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    RideId:
      name: id
      in: path
      required: true
      schema: { type: integer }

  responses:
    Message:
      description: OK
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
    Forbidden:
      description: Missing permission
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    NotFound:
      description: Not found (or not yours)
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    TooManyRequests:
      description: Rate limit hit — retry after `Retry-After` seconds
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
    Conflict:
      description: Invalid state transition or resource already taken
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
    ForbiddenOrPaused:
      description: >-
        Missing permission, or the service is not taking new requests (S23.1) — then
        `reason_code` is set (not_released, paused, app_update_required). Existing work is unaffected.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/ServiceUnavailable" }
              - type: object
                properties:
                  error: { type: string }
                  message: { type: string }
    ValidationOrNotServed:
      description: >-
        Validation failed (`errors` present), or the pickup is outside every active
        service area / the service is switched off there (S10.4) — `message` is
        user-facing, e.g. "Not available here yet. Jali currently works in Kigali."
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            required: [message, errors]
            properties:
              message: { type: string }
              errors:
                type: object
                additionalProperties:
                  type: array
                  items: { type: string }

  schemas:
    JourneyStopRef:
      type: object
      required: [seq, name, time]
      properties:
        seq: { type: integer }
        name: { type: string }
        time: { type: [string, "null"], description: "HH:MM at this stop" }
    JourneyMatch:
      type: object
      required: [listing_id, date, driver, from, to, route, fare, seats_left, pickup_point, allow_custom_pickup, custom_pickup_fee, amenities]
      properties:
        listing_id: { type: integer }
        date: { type: string, format: date }
        driver:
          type: object
          properties:
            name: { type: string }
            rating: { type: number }
        from: { $ref: "#/components/schemas/JourneyStopRef" }
        to: { $ref: "#/components/schemas/JourneyStopRef" }
        route: { type: array, items: { type: string } }
        fare: { type: integer, description: Per seat for my segment }
        seats_left: { type: integer, description: Free on every segment I ride }
        pickup_point: { type: string }
        allow_custom_pickup: { type: boolean }
        custom_pickup_fee: { type: integer }
        amenities: { type: array, items: { type: string } }
    JourneyDetail:
      type: object
      required: [id, date, seats, driver, stops, seats_left_per_segment]
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        seats: { type: integer }
        driver:
          type: object
          properties:
            name: { type: string }
            rating: { type: number }
        stops:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/JourneyStopRef" }
              - type: object
                properties:
                  fare_to_next: { type: [integer, "null"] }
        seats_left_per_segment: { type: array, items: { type: integer } }
        pickup_station: { type: [string, "null"] }
        drop_location: { type: [string, "null"] }
        allow_custom_pickup: { type: boolean }
        custom_pickup_fee: { type: integer }
        amenities: { type: array, items: { type: string } }
        notes: { type: [string, "null"] }
    AdminHirePerson:
      type: [object, "null"]
      required: [id, name, phone]
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }
    AdminHireSummary:
      type: object
      required: [id, status, customer, driver, start_at, end_at, quoted_total, final_total, requested_at]
      properties:
        id: { type: integer }
        status: { type: string }
        customer: { $ref: "#/components/schemas/AdminHirePerson" }
        open_disputes: { type: integer }
        driver: { $ref: "#/components/schemas/AdminHirePerson" }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        quoted_total: { type: integer }
        final_total: { type: [integer, "null"] }
        requested_at: { type: [string, "null"], format: date-time }
    AdminHireDetail:
      allOf:
        - { $ref: "#/components/schemas/AdminHireSummary" }
        - type: object
          required: [duration, trip_type, transmission, pickup, quote, timeline, ratings, checked_in_at, checked_out_at]
          properties:
            duration:
              type: object
              properties:
                type: { type: string, enum: [hours, days] }
                value: { type: integer }
            trip_type: { type: string }
            transmission: { type: string }
            pickup:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
                address: { type: [string, "null"] }
            car_description: { type: [string, "null"] }
            notes: { type: [string, "null"] }
            payment_method: { type: [string, "null"] }
            cancel_reason: { type: [string, "null"] }
            cancelled_by: { type: [string, "null"] }
            checked_in_at: { type: [string, "null"], format: date-time }
            checked_out_at: { type: [string, "null"], format: date-time }
            quote:
              type: object
              required: [rate, driver_total, service_fee, quoted_total, overtime_minutes, overtime_amount, final_total, commission_pct, commission, cancel_fee]
              properties:
                rate: { type: object }
                driver_total: { type: integer }
                service_fee: { type: integer }
                quoted_total: { type: integer }
                overtime_minutes: { type: integer }
                overtime_amount: { type: integer }
                final_total: { type: [integer, "null"] }
                commission_pct: { type: number }
                commission: { type: [integer, "null"] }
                cancel_fee: { type: integer }
            timeline:
              type: array
              items:
                type: object
                required: [type, actor, note, at]
                properties:
                  type: { type: string }
                  actor: { type: [string, "null"] }
                  note: { type: [string, "null"] }
                  at: { type: [string, "null"], format: date-time }
            disputes:
              type: array
              items:
                type: object
                required: [id, role, by, reason, status]
                properties:
                  id: { type: integer }
                  role: { type: string, enum: [customer, driver] }
                  by: { type: [string, "null"] }
                  reason: { type: string }
                  claimed_end: { type: [string, "null"] }
                  status: { type: string, enum: [open, resolved] }
                  resolution: { type: [string, "null"] }
                  resolved_by: { type: [string, "null"] }
                  created_at: { type: [string, "null"], format: date-time }
                  resolved_at: { type: [string, "null"], format: date-time }
            ratings:
              type: array
              items:
                type: object
                properties:
                  from: { type: string, enum: [customer, driver] }
                  stars: { type: integer }
                  tags: { type: array, items: { type: string } }
                  comment: { type: [string, "null"] }
    SupportTicketInput:
      type: object
      required: [category, message]
      properties:
        category: { $ref: "#/components/schemas/HelpContext" }
        subject_type: { type: [string, "null"], enum: [ride, hire, rental, null] }
        subject_id: { type: [integer, "null"] }
        message: { type: string, minLength: 5, maxLength: 2000 }
    SupportMessage:
      type: object
      required: [id, is_staff, body, created_at, author]
      properties:
        id: { type: integer }
        is_staff: { type: boolean }
        body: { type: string }
        created_at: { type: string, format: date-time }
        author: { type: string, description: '"Jali support" for staff messages shown to customers' }
    SupportTicket:
      type: object
      required: [id, category, priority, status, subject, preview, created_at, last_message_at, resolved_at]
      properties:
        id: { type: integer }
        category: { $ref: "#/components/schemas/HelpContext" }
        priority: { type: string, enum: [urgent, high, normal] }
        status: { type: string, enum: [open, answered, resolved] }
        subject:
          type: [object, "null"]
          required: [type, id, label]
          properties:
            type: { type: string, enum: [ride, hire, rental] }
            id: { type: integer }
            label: { type: string }
        preview: { type: string }
        created_at: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
    SupportTicketDetail:
      allOf:
        - { $ref: "#/components/schemas/SupportTicket" }
        - type: object
          required: [messages]
          properties:
            messages:
              type: array
              items: { $ref: "#/components/schemas/SupportMessage" }
    StaffSupportFields:
      type: object
      required: [user, assignee, sla]
      properties:
        user:
          type: object
          required: [id, name, phone]
          properties:
            id: { type: integer }
            name: { type: [string, "null"] }
            phone: { type: [string, "null"] }
        assignee:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        sla:
          type: object
          required: [first_response_due_at, first_responded_at, overdue]
          properties:
            first_response_due_at: { type: string, format: date-time }
            first_responded_at: { type: [string, "null"], format: date-time }
            overdue: { type: boolean }
    StaffSupportTicket:
      allOf:
        - { $ref: "#/components/schemas/SupportTicket" }
        - { $ref: "#/components/schemas/StaffSupportFields" }
    StaffSupportTicketDetail:
      allOf:
        - { $ref: "#/components/schemas/SupportTicketDetail" }
        - { $ref: "#/components/schemas/StaffSupportFields" }
    SupportInbox:
      type: object
      required: [data, counts]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/StaffSupportTicket" }
        counts:
          type: object
          required: [open, urgent, overdue]
          properties:
            open: { type: integer }
            urgent: { type: integer }
            overdue: { type: integer }
    CannedReply:
      type: object
      required: [id, title, body]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
    Locale:
      type: string
      enum: [en, fr, rw, sw]
    HelpContext:
      type: string
      enum: [charged_wrong, driver_behaviour, lost_item, safety, cancel, damage, payment, account, other]
    Translations:
      type: object
      required: [en, fr, rw, sw]
      properties:
        en: { type: string }
        fr: { type: string }
        rw: { type: string }
        sw: { type: string }
    HelpTopic:
      type: object
      required: [id, slug, title, body, services, contexts]
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        body: { type: string, description: Plain text; blank lines separate paragraphs }
        services:
          type: array
          description: Empty = every service
          items: { $ref: "#/components/schemas/ServiceKey" }
        contexts:
          type: array
          items: { $ref: "#/components/schemas/HelpContext" }
