        zones_count: { type: integer }
        updated_at: { type: [string, "null"], format: date-time }
    ServiceAreaInput:
      type: object
      description: Give one shape — `polygon`, `geojson` (Polygon/Feature, as object or text) or `circle` — required on create
      properties:
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [city, zone] }
        zone_type: { type: [string, "null"], enum: [airport, stadium, station, pickup, other, null] }
        parent_id: { type: [integer, "null"], description: City of a zone }
        active: { type: boolean }
        polygon:
          type: array
          minItems: 3
          maxItems: 500
          items: { $ref: "#/components/schemas/LatLng" }
        geojson:
          oneOf:
            - type: string
            - type: object
        circle:
          type: object
          required: [lat, lng, radius_km]
          properties:
            lat: { type: number }
            lng: { type: number }
            radius_km: { type: number, minimum: 0.1, maximum: 100 }
        overrides:
          oneOf:
            - { $ref: "#/components/schemas/ServiceAreaOverrides" }
            - type: "null"
