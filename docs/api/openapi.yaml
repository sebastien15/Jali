                  status: { $ref: "#/components/schemas/RideStatus" }
                  active: { type: boolean }
                  rider:
                    type: object
                    properties:
                      first_name: { type: string }
                  driver:
                    type: [object, "null"]
                    properties:
                      name: { type: string }
                      photo: { type: [string, "null"] }
                  vehicle:
                    type: [object, "null"]
                    properties:
                      model: { type: string }
                      color: { type: [string, "null"] }
                      plate: { type: string }
                      photo: { type: [string, "null"] }
                  position:
                    type: [object, "null"]
                    properties:
                      lat: { type: number }
                      lng: { type: number }
                      at: { type: [string, "null"] }
                  pickup: { type: [string, "null"] }
                  dropoff: { type: [string, "null"] }
                  updated_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
