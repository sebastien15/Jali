    DriverOnboarding:
      type: object
      required: [status, can_submit, steps, services, rejection_reason, licence, documents]
      properties:
        status: { type: string, enum: [draft, pending, verified, rejected, suspended] }
        can_submit: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [key, done, required]
            properties:
              key: { type: string, enum: [services, profile, licence, documents, vehicle, rates] }
              done: { type: boolean }
              required: { type: boolean }
        services:
          type: array
          items: { $ref: "#/components/schemas/DriverService" }
        rejection_reason: { type: [string, "null"] }
        licence:
          type: object
          required: [licence_no, licence_categories, licence_expiry, national_id_no]
          properties:
            licence_no: { type: [string, "null"] }
            licence_categories: { type: array, items: { type: string } }
            licence_expiry: { type: [string, "null"], format: date }
            national_id_no: { type: [string, "null"] }
        documents:
          type: array
          items:
            type: object
            required: [type, required, status, rejection_reason, id, file_url, updated_at]
            properties:
              type: { $ref: "#/components/schemas/DriverDocumentType" }
              required: { type: boolean }
              status: { type: string, enum: [missing, uploaded, approved, rejected] }
              rejection_reason: { type: [string, "null"] }
              id: { type: [integer, "null"] }
              file_url: { type: [string, "null"], description: "Send the bearer token when loading it" }
              updated_at: { type: [string, "null"], format: date-time }

    DriverApplication:
      type: object
      required: [user, status, submitted_at, verified_at, rejection_reason, services, licence, checklist, documents, vehicles, rates]
      properties:
        user:
          type: object
          required: [id, name, email, phone, role]
          properties:
            id: { type: integer }
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
            phone: { type: [string, "null"] }
            role: { type: string }
            profile_image_url: { type: [string, "null"] }
        status: { type: string, enum: [pending, verified, rejected, suspended] }
        submitted_at: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        rejection_reason: { type: [string, "null"] }
        services: { type: array, items: { $ref: "#/components/schemas/DriverService" } }
        licence: { $ref: "#/components/schemas/DriverOnboarding/properties/licence" }
        checklist: { $ref: "#/components/schemas/DriverOnboarding/properties/steps" }
        documents: { $ref: "#/components/schemas/DriverOnboarding/properties/documents" }
        vehicles: { type: array, items: { $ref: "#/components/schemas/Vehicle" } }
        rates: { type: array, items: { $ref: "#/components/schemas/DriverRates" } }

    VehiclePhotos:
      type: object
      description: Public URLs per photo slot; `front` is required before going online
      properties:
        front: { type: string }
        side: { type: string }
        interior: { type: string }
        luggage: { type: string }

    VehicleInput:
      type: object
      properties:
        class: { $ref: "#/components/schemas/VehicleClass" }
        body_type: { type: [string, "null"], enum: [Sedan, SUV, Minivan, Pickup, Hatchback, Motorcycle, null] }
        make: { type: [string, "null"], maxLength: 50 }
        model: { type: string, maxLength: 100 }
        color: { type: [string, "null"], maxLength: 30 }
        year: { type: [integer, "null"], minimum: 1980 }
        plate: { type: string, maxLength: 20 }
        seats: { type: integer, minimum: 1, maximum: 60, description: "Moto: at most 2" }
        amenities: { type: [array, "null"], items: { type: string } }
        insurance_expiry: { type: string, format: date }

    DriverProfileResponse:
      type: object
      required: [user, profile, vehicle, vehicles]
      properties:
        user:
          type: object
          required: [id, name, email, phone]
          properties:
            id: { type: integer }
            name: { type: [string, "null"] }
            email: { type: [string, "null"] }
            phone: { type: [string, "null"] }
        profile:
          oneOf:
            - type: "null"
            - type: object
              required: [services, allowed_zones, docs_url, verification_status, rating_avg, trips_count]
              properties:
                services:
                  type: array
                  items: { type: string, enum: [ride, hire, private_seat, rental] }
                allowed_zones: { type: array, items: { type: string } }
                docs_url: { type: [string, "null"] }
                verification_status: { type: string, enum: [pending, verified, rejected, suspended] }
                rating_avg: { type: number }
                trips_count: { type: integer }
        vehicle:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Vehicle"
        vehicles:
          type: array
          items: { $ref: "#/components/schemas/Vehicle" }

    DriverProfileUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        fcm_token: { type: string }
        services:
          type: array
          items: { type: string, enum: [ride, hire, private_seat, rental] }
        allowed_zones: { type: array, items: { type: string } }
        docs_url: { type: [string, "null"], format: uri }
        car_model: { type: string, maxLength: 100 }
        plate: { type: string, maxLength: 20 }
        car_type: { type: string, enum: [Sedan, SUV, Minivan, Pickup] }
        seats: { type: integer, minimum: 1, maximum: 60 }
        amenities: { type: array, items: { type: string } }
        insurance_expiry: { type: [string, "null"], format: date }
        price_day: { type: [integer, "null"], minimum: 0 }
        caution: { type: [integer, "null"], minimum: 0 }

    DriverRates:
      type: object
      description: RIDE_HAILING_PLAN.md §3.1
      required: [base_fare, per_km, min_fare]
      properties:
        vehicle_id: { type: integer }
        base_fare: { type: integer, minimum: 0 }
        per_km: { type: integer, minimum: 0 }
        per_min: { type: integer, minimum: 0, default: 0 }
        min_fare: { type: integer, minimum: 0 }
        pickup_free_km: { type: number, minimum: 0, default: 2 }
        pickup_per_km: { type: integer, minimum: 0, default: 0 }
        night_multiplier: { type: number, minimum: 1, maximum: 2, default: 1 }

    DriverPresenceState:
      type: object
      required: [online, online_since, blocked_reasons]
      properties:
        online: { type: boolean }
        online_since: { type: [string, "null"], format: date-time }
        blocked_reasons:
          type: array
          items:
            type: string
            enum: [not_verified, suspended, no_active_vehicle, insurance_expired, no_vehicle_photo, no_rates, rates_outside_limits, commission_owed]

    DriverRatesResponse:
      type: object
      required: [vehicle, rates, out_of_band, guardrails, service_fee, commission_pct, preview]
      properties:
        vehicle:
          oneOf:
            - type: "null"
            - type: object
              required: [id, class, model, plate]
              properties:
                id: { type: integer }
                class: { $ref: "#/components/schemas/VehicleClass" }
                model: { type: string }
                plate: { type: string }
        rates:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DriverRates"
        out_of_band:
          type: boolean
          description: True when guardrails changed and these rates must be updated
        guardrails:
          type: object
          required: [per_km_min, per_km_max, min_fare_max]
          properties:
            per_km_min: { type: integer }
            per_km_max: { type: integer }
            min_fare_max: { type: integer }
        service_fee:
          type: object
          required: [type, amount]
          properties:
            type: { type: string, enum: [flat, percent] }
            amount: { type: number }
        commission_pct: { type: number }
        preview:
          type: array
          description: Daytime price for sample trips (no pickup surcharge)
          items:
            type: object
            required: [km, driver_fare, service_fee, total]
            properties:
              km: { type: number }
              driver_fare: { type: integer }
              service_fee: { type: integer }
              total: { type: integer }

    PlaceResult:
      type: object
      required: [name, address, lat, lng]
      properties:
        name: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }

    TripPoints:
      type: object
      required: [pickup, dropoff]
      properties:
        pickup: { $ref: "#/components/schemas/Place" }
        dropoff: { $ref: "#/components/schemas/Place" }

    AdminPerson:
      type: [object, "null"]
      required: [id, name, phone]
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }

    RideMetrics:
      type: object
      required: [requested, completed, cancelled_by_rider, cancelled_by_driver, expired, rider_cancel_rate, driver_cancel_rate, expired_rate, gmv, commission, avg_pickup_minutes]
      properties:
        requested: { type: integer }
        completed: { type: integer }
        cancelled_by_rider: { type: integer }
        cancelled_by_driver: { type: integer }
        expired: { type: integer }
        rider_cancel_rate: { type: number, description: "0-1 share of requested rides" }
        driver_cancel_rate: { type: number, description: "0-1 share of requested rides" }
        expired_rate: { type: number, description: "0-1 share of requested rides" }
        gmv: { type: integer, description: Sum of final fares of completed rides (RWF) }
        commission: { type: integer, description: Jali commission on completed rides (RWF) }
        avg_pickup_minutes: { type: [number, "null"], description: Average minutes from accept to arrive }
    TopDriver:
      type: object
      required: [id, name, trips, rating, rating_count]
      properties:
        id: { type: integer }
        name: { type: [string, "null"] }
        trips: { type: integer, description: Completed trips in the window }
        rating: { type: [number, "null"] }
        rating_count: { type: integer }
    AdminRideSummary:
      type: object
      required: [id, status, vehicle_class, rider, driver, pickup, dropoff, quoted_fare, final_fare, flagged, requested_at]
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/RideStatus" }
        vehicle_class: { $ref: "#/components/schemas/VehicleClass" }
        rider: { $ref: "#/components/schemas/AdminPerson" }
        driver: { $ref: "#/components/schemas/AdminPerson" }
        pickup: { $ref: "#/components/schemas/Place" }
        dropoff: { $ref: "#/components/schemas/Place" }
        quoted_fare: { type: integer }
        final_fare: { type: [integer, "null"] }
        flagged: { type: boolean }
        requested_at: { type: [string, "null"], format: date-time }

    AdminRideDetail:
      allOf:
        - $ref: "#/components/schemas/AdminRideSummary"
        - type: object
          required: [payment_method, cancel_reason, cancelled_by, pin_attempts, vehicle, fare, timeline, ratings]
          properties:
            payment_method: { type: [string, "null"], enum: [cash, momo, null] }
            cancel_reason: { type: [string, "null"] }
            cancelled_by: { type: [string, "null"], enum: [rider, driver, system, null] }
            pin_attempts: { type: integer }
            vehicle:
              type: [object, "null"]
              properties:
                plate: { type: string }
                model: { type: string }
                color: { type: [string, "null"] }
            fare:
              type: object
              required: [est_distance_km, est_minutes, pickup_km, rate, driver_fare, service_fee, quoted_fare, cancel_fee, commission_pct, commission, final_fare]
              properties:
                est_distance_km: { type: number }
                est_minutes: { type: integer }
                pickup_km: { type: number }
                rate: { type: object, description: Driver's prices locked at request time }
                driver_fare: { type: integer }
                service_fee: { type: integer }
                quoted_fare: { type: integer }
                cancel_fee: { type: integer }
                commission_pct: { type: number }
                commission: { type: [integer, "null"] }
                final_fare: { type: [integer, "null"] }
            timeline:
              type: array
              items:
                type: object
                required: [type, actor, payload, at]
                properties:
                  type: { type: string, description: "requested, accepted, arrived, pin_failed, started, completed, cancelled, expired, adjusted, …" }
                  actor: { type: [string, "null"], description: "Name, or \"system\"" }
                  payload: { type: [object, array, "null"] }
                  at: { type: [string, "null"], format: date-time }
            ratings:
              type: array
              items:
                type: object
                required: [from, stars, tags, comment]
                properties:
                  from: { type: string, enum: [rider, driver] }
                  stars: { type: integer, minimum: 1, maximum: 5 }
                  tags: { type: array, items: { type: string } }
                  comment: { type: [string, "null"] }

    Transmission:
      type: string
      enum: [automatic, manual]

    HireLanguage:
      type: string
      enum: [rw, en, fr, sw, other]
      description: Kinyarwanda, English, French, Swahili, other

    HireTripType:
      type: string
      enum: [city, out_of_town, airport]

    HireRates:
      type: object
      required: [hourly_rate, min_hours, daily_rate, daily_hours, overtime_per_hour]
      properties:
        hourly_rate: { type: integer, description: "RWF per hour, within hire.hourly_min–hourly_max" }
        min_hours: { type: integer, minimum: 1, maximum: 12 }
        daily_rate: { type: integer, description: "RWF per day, within hire.daily_min–daily_max" }
        daily_hours: { type: integer, minimum: 4, maximum: 16, description: Hours included in a day }
        overtime_per_hour: { type: integer, minimum: 0 }
        out_of_town_fee: { type: integer, minimum: 0, description: RWF per day when the trip leaves Kigali }

    HireSettingsPayload:
      type: object
      required: [settings, skills, limits]
      properties:
        settings:
          oneOf:
            - type: "null"
            - allOf:
                - $ref: "#/components/schemas/HireRates"
                - type: object
                  required: [is_active]
                  properties:
                    is_active: { type: boolean }
        skills:
          type: object
          required: [transmissions, languages, years_experience, licence_categories]
          properties:
            transmissions: { type: array, items: { $ref: "#/components/schemas/Transmission" } }
            languages: { type: array, items: { $ref: "#/components/schemas/HireLanguage" } }
            years_experience: { type: [integer, "null"] }
            licence_categories: { type: array, items: { type: string }, description: From the licence step of onboarding }
        limits:
          type: object
          description: Superadmin guardrails (platform_settings rides.hire)
          properties:
            hourly_min: { type: integer }
            hourly_max: { type: integer }
            daily_min: { type: integer }
            daily_max: { type: integer }
            overtime_max: { type: integer }
            out_of_town_max: { type: integer }
            commission_pct: { type: number }
            service_fee: { type: integer }

    WeeklyHours:
      type: object
      required: [weekday, start_time, end_time]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0 = Sunday" }
        start_time: { type: string, pattern: "^\\d{2}:\\d{2}$", example: "07:00" }
        end_time: { type: string, pattern: "^\\d{2}:\\d{2}$", example: "20:00" }

    Availability:
      type: object
      required: [weekly, blocked_dates, upcoming]
      properties:
        weekly: { type: array, items: { $ref: "#/components/schemas/WeeklyHours" } }
        blocked_dates: { type: array, items: { type: string, format: date } }
        upcoming:
          type: array
          description: Accepted or started hires that hold my time
          items:
            type: object
            required: [id, start_at, end_at]
            properties:
              id: { type: integer }
              start_at: { type: string, format: date-time }
              end_at: { type: string, format: date-time }

    HireQuote:
      type: object
      required: [driver_total, service_fee, total, billable_hours, days]
      properties:
        driver_total: { type: integer, description: "Driver's price incl. out-of-town fee, rounded up to 100 RWF" }
        service_fee: { type: integer }
        total: { type: integer, description: What the customer pays (before any overtime) }
        billable_hours: { type: integer, description: "Hours: max(asked, min_hours). Days: days × daily_hours" }
        days: { type: integer }

    AvailableHireDriver:
      type: object
      required: [driver_id, name, photo, rating, rating_count, trips_count, years_experience, languages, transmissions, licence_categories, rates, end_at, quote]
      properties:
        driver_id: { type: integer }
        name: { type: string, description: "First name + last initial" }
        photo: { type: [string, "null"] }
        rating: { type: number }
        rating_count: { type: integer }
        trips_count: { type: integer }
        years_experience: { type: [integer, "null"] }
        languages: { type: array, items: { $ref: "#/components/schemas/HireLanguage" } }
        transmissions: { type: array, items: { $ref: "#/components/schemas/Transmission" } }
        licence_categories: { type: array, items: { type: string } }
        rates: { $ref: "#/components/schemas/HireRates" }
        end_at: { type: string, format: date-time }
        quote: { $ref: "#/components/schemas/HireQuote" }

    HireStatus:
      type: string
      enum: [requested, accepted, started, completed, declined, expired, cancelled_by_customer, cancelled_by_driver, no_show_driver, no_show_customer]

    DriverHire:
      type: object
      required: [id, role, status, start_at, end_at, duration_type, duration_value, trip_type, transmission, pickup, driver_total, service_fee, quoted_total,
        overtime_minutes, overtime_amount, final_total, driver_earnings, cancel_fee, cancel_fee_now, payment_method, expires_at, driver, customer, my_rating]
      properties:
        id: { type: integer }
        role: { type: string, enum: [customer, driver], description: Who is looking }
        status: { $ref: "#/components/schemas/HireStatus" }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        duration_type: { type: string, enum: [hours, days] }
        duration_value: { type: integer }
        trip_type: { $ref: "#/components/schemas/HireTripType" }
        transmission: { $ref: "#/components/schemas/Transmission" }
        pickup: { $ref: "#/components/schemas/Place" }
        car_description: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        driver_total: { type: integer }
        service_fee: { type: integer }
        quoted_total: { type: integer, description: Locked price the customer pays (driver_total + service_fee) }
        overtime_minutes: { type: integer }
        overtime_amount: { type: integer }
        final_total: { type: [integer, "null"], description: "quoted_total + overtime, set at check-out" }
        driver_earnings: { type: [integer, "null"], description: "Driver view only: driver part minus commission" }
        cancel_fee: { type: integer }
        cancel_fee_now: { type: [integer, "null"], description: "Customer view while cancellable: fee if cancelled now (0 = free)" }
        cancel_reason: { type: [string, "null"] }
        payment_method: { type: [string, "null"], enum: [cash, momo, null] }
        expires_at: { type: [string, "null"], format: date-time, description: "While requested: when the driver's answer times out" }
        driver:
          type: object
          required: [id, name, photo, rating, years_experience, languages, phone]
          properties:
            id: { type: integer }
            name: { type: string }
            photo: { type: [string, "null"] }
            rating: { type: number }
            years_experience: { type: [integer, "null"] }
            languages: { type: array, items: { $ref: "#/components/schemas/HireLanguage" } }
            phone: { type: [string, "null"], description: "Customer view while accepted or started" }
        customer:
          description: Driver view only
          type: [object, "null"]
          required: [name, phone]
          properties:
            name: { type: string }
            phone: { type: [string, "null"], description: While accepted or started }
        my_rating: { type: [integer, "null"] }
        no_show_from: { type: [string, "null"], format: date-time, description: "S6.5: from when either side may report a no-show (accepted hires)" }
        can_dispute: { type: boolean, description: "S6.5: this viewer may dispute the recorded hours now" }
        my_dispute:
          type: [object, "null"]
          properties:
            status: { type: string, enum: [open, resolved] }
            reason: { type: string }
            resolution: { type: [string, "null"] }
            created_at: { type: [string, "null"], format: date-time }
        requested_at: { type: [string, "null"], format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        checked_in_at: { type: [string, "null"], format: date-time }
        checked_out_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }

    DriverEarningsPeriod:
      type: object
      required: [trips, collected, earnings, commission]
      properties:
        trips: { type: integer }
        collected: { type: integer, description: What riders and customers paid }
        earnings: { type: integer, description: Driver's net (driver price − commission) }
        commission: { type: integer, description: Commission + Jali fees owed for the period }

    DriverEarnings:
      type: object
      required: [periods, balance, owed, max_owed, blocked, pay_to, momo, ledger, settlements, payouts]
      properties:
        periods:
          type: object
          required: [today, week, month]
          properties:
            today: { $ref: "#/components/schemas/DriverEarningsPeriod" }
            week: { $ref: "#/components/schemas/DriverEarningsPeriod" }
            month: { $ref: "#/components/schemas/DriverEarningsPeriod" }
        balance: { type: integer, description: "> 0 Jali owes me · < 0 I owe Jali" }
        owed: { type: integer }
        max_owed: { type: integer }
        blocked: { type: boolean, description: "Owed above max: settle before going online" }
        pay_to:
          type: object
          properties:
            number: { type: [string, "null"] }
            name: { type: [string, "null"] }
        momo:
          type: object
          properties:
            number: { type: [string, "null"] }
            name: { type: [string, "null"] }
        ledger:
          type: array
          items:
            type: object
            required: [id, type, amount, balance_effect, balance_after, at]
            properties:
              id: { type: integer }
              type: { type: string, enum: [earning, commission, settlement, payout, adjustment] }
              source_type: { type: string }
              source_id: { type: [integer, "null"] }
              amount: { type: integer }
              balance_effect: { type: integer }
              balance_after: { type: integer }
              note: { type: [string, "null"] }
              at: { type: [string, "null"], format: date-time }
        settlements:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              amount: { type: integer }
              reference: { type: string }
              status: { type: string, enum: [pending, confirmed, rejected] }
              at: { type: [string, "null"], format: date-time }
        payouts:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              amount: { type: integer }
              status: { type: string }
              at: { type: [string, "null"], format: date-time }

    EmergencyContact:
      type: object
      required: [name, phone]
      properties:
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }

    ChatPhrase:
      type: string
      enum: [on_my_way, i_am_here, where_are_you, wait_2_min, cant_find_you, at_the_entrance, running_late, thank_you]

    RideMessage:
      type: object
      required: [id, mine, phrase, body, at]
      properties:
        id: { type: integer }
        mine: { type: boolean }
        phrase: { oneOf: [{ $ref: "#/components/schemas/ChatPhrase" }, { type: "null" }] }
        body: { type: [string, "null"] }
        at: { type: [string, "null"], format: date-time }

    ReceiptLink:
      type: object
      required: [url, emailed]
      properties:
        url: { type: string, description: "Signed link to the printable receipt, valid 30 days" }
        emailed: { type: boolean }

    Place:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
        address: { type: [string, "null"] }

    NearbyDriver:
      type: object
      required: [driver_id, name, rating, eta_min, distance_km, quote, vehicle, approx_location]
      properties:
        driver_id: { type: integer }
        name: { type: string, description: "First name + initial" }
        photo: { type: [string, "null"] }
        rating: { type: number }
        trips: { type: integer }
        eta_min: { type: integer }
        distance_km: { type: number }
        quote: { type: integer, description: "What the rider pays for this trip, incl. Jali fee and pickup surcharge" }
        per_km: { type: integer }
        vehicle:
          type: object
          required: [class, model, color, seats, amenities, photo]
          properties:
            class: { $ref: "#/components/schemas/VehicleClass" }
            model: { type: string }
            color: { type: [string, "null"] }
            seats: { type: integer }
            amenities: { type: array, items: { type: string } }
            photo: { type: [string, "null"], description: Front photo URL }
        approx_location:
          description: Rounded to ~100 m until a ride is accepted
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }

    RideStatus:
      type: string
      enum: [requested, accepted, arrived, in_progress, completed, declined, expired, cancelled_by_rider, cancelled_by_driver]

    Ride:
      type: object
      description: One ride as seen by the requesting user (rider or driver)
      required: [id, role, status, mode, vehicle_class, pickup, dropoff, est_distance_km, est_minutes, quoted_fare, driver_fare,
                 service_fee, final_fare, driver_earnings, cancel_fee, cancel_reason, start_pin, payment_method, expires_at,
                 driver, rider, my_rating, requested_at, accepted_at, arrived_at, started_at, completed_at, cancelled_at]
      properties:
        id: { type: integer }
        role: { type: string, enum: [rider, driver], description: Who is looking }
        status: { $ref: "#/components/schemas/RideStatus" }
        mode: { type: string, enum: [pick, broadcast] }
        vehicle_class: { $ref: "#/components/schemas/VehicleClass" }
        pickup: { $ref: "#/components/schemas/Place" }
        dropoff: { $ref: "#/components/schemas/Place" }
        est_distance_km: { type: number }
        est_minutes: { type: integer }
        quoted_fare: { type: integer, description: "Locked total the rider pays (driver fare + Jali fee). Broadcast: lowest offer until a driver accepts, then the winner's price" }
        max_fare: { type: [integer, "null"], description: "Broadcast: the rider's maximum" }
        driver_fare: { type: integer }
        service_fee: { type: integer }
        final_fare: { type: [integer, "null"] }
        driver_earnings: { type: [integer, "null"], description: "Driver view only: driver fare minus commission" }
        cancel_fee: { type: integer }
        cancel_reason: { type: [string, "null"] }
        start_pin: { type: [string, "null"], description: "Rider view only, while the ride is active" }
        payment_method: { type: [string, "null"], enum: [cash, momo, null] }
        expires_at: { type: [string, "null"], format: date-time, description: "While requested: when the driver's answer times out" }
        driver:
          oneOf:
            - type: "null"
            - type: object
              required: [id, name, photo, rating, phone, location, vehicle]
              properties:
                id: { type: integer }
                name: { type: string }
                photo: { type: [string, "null"] }
                rating: { type: number }
                phone: { type: [string, "null"], description: "Rider view, once accepted" }
                momo:
                  description: "Rider view when paying by MoMo, once the trip started (S7.1)"
                  type: [object, "null"]
                  properties:
                    number: { type: string }
                    name: { type: [string, "null"] }
                location:
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [lat, lng]
                      properties:
                        lat: { type: number }
                        lng: { type: number }
                        heading: { type: [number, "null"] }
                        at: { type: [string, "null"], format: date-time }
                vehicle:
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [class, model, color, plate, photo]
                      properties:
                        class: { $ref: "#/components/schemas/VehicleClass" }
                        model: { type: string }
                        color: { type: [string, "null"] }
                        plate: { type: string }
                        photo: { type: [string, "null"] }
        rider:
          description: Driver view only
          oneOf:
            - type: "null"
            - type: object
              required: [name, rating, phone]
              properties:
                name: { type: string }
                rating: { type: [number, "null"] }
                phone: { type: [string, "null"] }
        my_rating: { type: [integer, "null"], description: Stars I gave for this ride }
        requested_at: { type: [string, "null"], format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        arrived_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }

    RideRequestCard:
      type: object
      description: What an online driver sees before accepting (no exact pickup, no phone)
      required: [ride_id, pickup_area, dropoff_area, trip_km, pickup_km, earnings, expires_at]
      properties:
        ride_id: { type: integer }
        pickup_area: { type: string }
        dropoff_area: { type: string }
        trip_km: { type: number }
        pickup_km: { type: number }
        earnings: { type: integer, description: "Driver's quote minus commission" }
        broadcast: { type: boolean, description: "Sent to several drivers — first to accept wins (S3.5)" }
        rider_rating: { type: [number, "null"] }
        payment_method: { type: string, enum: [cash, momo] }
        expires_at: { type: string, format: date-time }

    RideSettings:
      type: object
      description: platform_settings `rides` (RIDE_HAILING_PLAN.md §3.3). Responses always contain every field; PUT accepts any subset.
      required: [vehicle_classes, road_factor, commission_pct, service_fee, nearby_radius_km, presence_ttl_sec, request_timeout_sec]
      properties:
        vehicle_classes:
          type: object
          additionalProperties:
            type: object
            properties:
              per_km_min: { type: integer }
              per_km_max: { type: integer }
              min_fare_max: { type: integer }
        road_factor: { type: number, default: 1.3 }
        commission_pct: { type: number, minimum: 0, maximum: 50 }
        service_fee:
          type: object
          properties:
            type: { type: string, enum: [flat, percent] }
            amount: { type: number }
        nearby_radius_km: { type: number, default: 5 }
        presence_ttl_sec: { type: integer, default: 60 }
        request_timeout_sec: { type: integer, default: 30 }
        broadcast_max_drivers: { type: integer, default: 5, description: "S3.5: how many nearest drivers get a broadcast" }
        max_commission_owed: { type: integer, default: 20000, description: "S5.4: drivers owing more can't go online" }
        review:
          type: object
          description: "S8.4: who appears in Needs review"
          properties:
            min_rated_trips: { type: integer }
            min_rating: { type: number }
            max_cancel_pct: { type: number }
            min_accepted: { type: integer }
            days: { type: integer }
        settlement_momo:
          type: object
          description: Where drivers send commission (S7.2)
          properties:
            number: { type: [string, "null"] }
            name: { type: [string, "null"] }
        cancel_fee: { type: integer, default: 500 }
        free_wait_min: { type: integer, default: 5 }
        hire: { $ref: "#/components/schemas/HireSettingsLimits" }

    HireSettingsLimits:
      type: object
      description: Hire a Driver limits and booking rules (epic E6)
      properties:
        hourly_min: { type: integer }
        hourly_max: { type: integer }
        daily_min: { type: integer }
        daily_max: { type: integer }
        overtime_max: { type: integer }
        out_of_town_max: { type: integer }
        commission_pct: { type: number }
        service_fee: { type: integer }
        request_timeout_min: { type: integer, description: Driver must answer within this (or before the start) }
        free_cancel_hours: { type: integer, description: Customer cancels free until this long before the start }
        late_cancel_pct: { type: integer, description: "% of the driver's price charged on a late cancellation" }
        overtime_grace_min: { type: integer }
        no_show_grace_min: { type: integer, description: "S6.5: a no-show can be reported this long after the start" }
        dispute_days: { type: integer, description: "S6.5: hours can be disputed this long after check-out" }
        max_days: { type: integer }

    RideSettingsUpdate:
      description: Any subset of RideSettings; a vehicle class must be sent complete
      type: object
      properties:
        vehicle_classes:
          type: object
          additionalProperties:
            type: object
            required: [per_km_min, per_km_max, min_fare_max]
            properties:
              per_km_min: { type: integer, minimum: 0 }
              per_km_max: { type: integer, minimum: 0 }
              min_fare_max: { type: integer, minimum: 0 }
        road_factor: { type: number, minimum: 1, maximum: 3 }
        commission_pct: { type: number, minimum: 0, maximum: 50 }
        service_fee:
          type: object
          required: [type, amount]
          properties:
            type: { type: string, enum: [flat, percent] }
            amount: { type: number, minimum: 0 }
        nearby_radius_km: { type: number, minimum: 0.5, maximum: 50 }
        presence_ttl_sec: { type: integer, minimum: 15, maximum: 600 }
        request_timeout_sec: { type: integer, minimum: 10, maximum: 300 }
        cancel_fee: { type: integer, minimum: 0, maximum: 10000 }
        free_wait_min: { type: integer, minimum: 0, maximum: 30 }
        hire: { $ref: "#/components/schemas/HireSettingsLimits" }
