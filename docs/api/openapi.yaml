        (no `app_version` and no `X-App-Version` header) are not version-gated.
      parameters:
        - { name: lat, in: query, schema: { type: number }, description: Customer position — adds region checks }
        - { name: lng, in: query, schema: { type: number } }
        - { name: app_version, in: query, schema: { type: string, example: "1.4.0" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceAccess" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
