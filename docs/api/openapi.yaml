                  data: { type: array, items: { $ref: "#/components/schemas/RentalBooking" } }
                  next_page: { type: [integer, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
