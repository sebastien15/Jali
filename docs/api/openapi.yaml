openapi: 3.1.0
info:
  title: Jali API
  version: 0.1.0
  description: |
    Contract between the Jali mobile app and the backend (Laravel today; any
    implementation that passes the contract tests can replace it — see
    `docs/api/README.md`).

    Scope of this version: identity, push tokens, driver profile, and the
    on-demand ride endpoints from `RIDE_HAILING_PLAN.md`. Operations marked
    `x-jali-status: planned` are agreed designs that are not implemented yet;
    everything else is implemented and checked by `backend/tests/Feature/ApiContractTest.php`.

    Conventions
    - All amounts are integers in RWF.
    - Coordinates are WGS84 decimal degrees.
    - Timestamps are ISO-8601 strings.
    - Errors: 401 `{error}`; 403 `{error}`; 409 `{message}`; 422 Laravel validation `{message, errors}`;
      429 `{message}` with `Retry-After` (seconds).
    - Rate limits (S21.7): every route 120/min per user (per IP when signed out),
      headers `X-RateLimit-Limit` / `X-RateLimit-Remaining`. Stricter: sign-in 10/min per IP
      and 20/h per email; OTP request 5/h per phone; OTP verify 10/h per phone;
      ride requests 6/min per rider.
servers:
  - url: https://api.jali.rw/api
    description: Production
  - url: https://jali.stoka.rw/backend/public/api
    description: Dev
  - url: http://127.0.0.1:4010
    description: Prism mock (`npm run api:mock` in mobile/)

security:
  - bearerAuth: []

tags:
  - name: Identity
    description: Current user and device registration
  - name: Driver
    description: Driver profile, vehicles and rates
  - name: Rides
    description: Rider side of on-demand rides
  - name: Driver rides
    description: Driver side of on-demand rides
  - name: Hire
    description: Customer side of Hire a Driver (a verified driver drives your own car)
  - name: Driver hire
    description: Driver side of Hire a Driver
  - name: Admin rides
    description: Ride operations and pricing settings
  - name: Rentals
    description: Customer side of car rental (Batch 1)
  - name: Owner rentals
    description: Car owners — listings, photos, papers, calendar, requests, handover and return
  - name: Admin rentals
    description: Rental car verification and rental operations
  - name: Service areas
    description: Cities and zones where services are offered (S10.4)
  - name: Help
    description: Help centre topics in en/fr/rw/sw (S16.2)
  - name: Support
    description: Support tickets linked to a ride, hire or rental; staff inbox with SLA (S16.3)
  - name: Journeys
    description: Shared journeys with stops — search, seats per segment (Batch 3)
  - name: Service access
    description: Which services an account can see, use and offer — one server answer for navigation and intake (S23.1)

paths:
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Current user with role and permissions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me/push-token:
    post:
      tags: [Identity]
      operationId: registerPushToken
      summary: Register this device's push token (Expo or FCM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 255, examples: ["ExponentPushToken[xxxxxxxx]"] }
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Identity]
      operationId: removePushToken
      summary: Stop push notifications to this account
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /driver/profile:
    get:
      tags: [Driver]
      operationId: getDriverProfile
      summary: Driver profile, active vehicle and all vehicles
      x-jali-permission: apply-as-driver
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    patch:
      tags: [Driver]
      operationId: updateDriverProfile
      summary: Save driver setup (profile + active vehicle)
      description: All fields optional. `car_model` and `plate` are required together the first time a vehicle is saved.
      x-jali-permission: apply-as-driver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverProfileUpdate" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverProfileResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/onboarding:
    get:
      tags: [Driver]
      operationId: getDriverOnboarding
      x-jali-story: S1.1
      x-jali-permission: apply-as-driver
      summary: Application checklist, status, licence and documents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverOnboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /driver/onboarding/services:
    put:
      tags: [Driver]
      operationId: putDriverServices
      x-jali-story: S1.1
      x-jali-permission: apply-as-driver
      summary: Choose what I offer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [services]
              properties:
                services:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/DriverService" }
      responses:
        "200":
          description: Updated checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverOnboarding" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/onboarding/licence:
    put:
      tags: [Driver]
      operationId: putDriverLicence
      x-jali-story: S1.2
      x-jali-permission: apply-as-driver
      summary: Driving licence details (an expired licence is rejected)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licence_no, licence_categories, licence_expiry]
              properties:
                licence_no: { type: string, maxLength: 50 }
                licence_categories:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [A, B, C, C1, D, D1, E, F] }
                licence_expiry: { type: string, format: date }
                national_id_no: { type: [string, "null"], maxLength: 50 }
      responses:
        "200":
          description: Updated checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverOnboarding" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/onboarding/submit:
    post:
      tags: [Driver]
      operationId: submitDriverApplication
      x-jali-story: S1.1
      x-jali-permission: apply-as-driver
      summary: Send the application for admin review (all required steps must be done)
      responses:
        "200":
          description: Submitted — status becomes pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverOnboarding" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/documents:
    post:
      tags: [Driver]
      operationId: uploadDriverDocument
      x-jali-story: S1.2
      x-jali-permission: apply-as-driver
      summary: Upload or replace a verification document (stored privately)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type: { $ref: "#/components/schemas/DriverDocumentType" }
                file: { type: string, format: binary, description: "jpg/png/webp/heic/pdf, max 10 MB" }
      responses:
        "200":
          description: Updated checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverOnboarding" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/documents/{id}/file:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Driver]
      operationId: getDriverDocumentFile
      x-jali-story: S1.2
      x-jali-permission: apply-as-driver
      summary: The document file — only for its owner or users with verify-drivers (404 otherwise)
      responses:
        "200":
          description: The file
          content:
            image/*: {}
            application/pdf: {}
        "404": { $ref: "#/components/responses/NotFound" }

  /driver/vehicles:
    get:
      tags: [Driver]
      operationId: listVehicles
      x-jali-story: S1.3
      x-jali-permission: apply-as-driver
      summary: My vehicles (active first)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Driver]
      operationId: createVehicle
      x-jali-story: S1.3
      x-jali-permission: apply-as-driver
      summary: Add a vehicle (the first one becomes active)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/VehicleInput"
                - required: [class, model, plate, seats, insurance_expiry]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/vehicles/{id}:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    patch:
      tags: [Driver]
      operationId: updateVehicle
      x-jali-story: S1.3
      x-jali-permission: apply-as-driver
      summary: Edit one of my vehicles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VehicleInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Driver]
      operationId: deleteVehicle
      x-jali-story: S1.3
      x-jali-permission: apply-as-driver
      summary: Remove one of my vehicles
      responses:
        "200": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/NotFound" }

  /driver/vehicles/{id}/activate:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    post:
      tags: [Driver]
      operationId: activateVehicle
      x-jali-story: S1.3
      x-jali-permission: apply-as-driver
      summary: Make this the vehicle riders see (others become inactive)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }

  /driver/vehicles/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/VehicleId"
    post:
      tags: [Driver]
      operationId: uploadVehiclePhoto
      x-jali-story: S1.3
      x-jali-permission: apply-as-driver
      summary: Upload or replace one vehicle photo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [slot, photo]
              properties:
                slot: { type: string, enum: [front, side, interior, luggage] }
                photo: { type: string, format: binary, description: "jpg/png/webp/heic, max 8 MB" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vehicle" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── Driver pricing & presence (planned) ─────────────────────────────────
  /driver/rates:
    get:
      tags: [Driver]
      operationId: getDriverRates
      x-jali-story: S2.1
      x-jali-permission: apply-as-driver
      summary: My ride rates for the active vehicle, the guardrails that apply, and a price preview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverRatesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Driver]
      operationId: putDriverRates
      x-jali-story: S2.1
      x-jali-permission: apply-as-driver
      summary: Set my ride rates (validated against the guardrails for my vehicle class)
      description: Rates are snapshotted when a ride is requested, so changes never affect rides already quoted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriverRates" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverRatesResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/presence:
    get:
      tags: [Driver rides]
      operationId: getDriverPresence
      x-jali-story: S5.1
      x-jali-permission: offer-rides
      summary: Am I online, and what blocks me from going online?
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPresenceState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Driver rides]
      operationId: postDriverPresence
      x-jali-story: S5.1
      x-jali-permission: offer-rides
      summary: Go online/offline; while online send this heartbeat with the position every 5–10 s
      description: |
        Going online is refused (online=false with blocked_reasons) until the driver is verified and the
        active vehicle has valid insurance, a front photo and prices within the limits. Without a heartbeat
        for presence_ttl_sec the driver is treated as offline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [online]
              properties:
                online: { type: boolean }
                lat: { type: [number, "null"], description: Required when online }
                lng: { type: [number, "null"], description: Required when online }
                heading: { type: [number, "null"], minimum: 0, maximum: 360 }
      responses:
        "200":
          description: Presence stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriverPresenceState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /driver/ride-requests:
    get:
      tags: [Driver rides]
      operationId: listRideRequests
      x-jali-story: S5.2
      x-jali-permission: offer-rides
      summary: Open ride requests sent to me (pick or broadcast)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RideRequestCard" }

  # ── Rider ───────────────────────────────────────────────────────────────
  /places/search:
    get:
      tags: [Rides]
      operationId: searchPlaces
      x-jali-story: S3.1
      x-jali-permission: request-rides
      summary: Places in Rwanda matching the text, biased around the rider (max 60/min)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 120 } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
      responses:
        "200":
          description: OK (empty list when nothing matches or the provider is down)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlaceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /places/reverse:
    get:
      tags: [Rides]
      operationId: reverseGeocode
      x-jali-story: S3.1
      x-jali-permission: request-rides
      summary: Readable address for a position (falls back to coordinates)
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /rides/nearby:
    get:
      tags: [Rides]
      operationId: getNearbyDrivers
      x-jali-story: S3.2
      x-jali-permission: request-rides
      summary: Online drivers near the pickup, each with their own price for this trip (closest first)
      description: |
        Only verified drivers whose heartbeat is within presence_ttl_sec, whose active vehicle matches
        the class filter and whose prices are within the current limits. Positions are rounded to ~100 m;
        no phone numbers. At most 50 drivers.
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: dest_lat, in: query, required: true, schema: { type: number } }
        - { name: dest_lng, in: query, required: true, schema: { type: number } }
        - { name: class, in: query, schema: { $ref: "#/components/schemas/VehicleClass" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [trip, drivers]
                properties:
                  trip:
                    type: object
                    required: [distance_km, est_minutes]
                    properties:
                      distance_km: { type: number }
                      est_minutes: { type: integer }
                  drivers:
                    type: array
                    items: { $ref: "#/components/schemas/NearbyDriver" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationOrNotServed" }

  /rides/estimate:
    post:
      tags: [Rides]
      operationId: estimateRide
      x-jali-story: S3.6
      x-jali-permission: request-rides
      summary: Price range and nearest ETA per vehicle class
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TripPoints" }
      responses:
        "200":
          description: Every class, in order moto → van; classes without drivers have available=false
          content:
            application/json:
              schema:
                type: object
                required: [trip, classes]
                properties:
                  trip:
                    type: object
                    required: [distance_km, est_minutes]
                    properties:
                      distance_km: { type: number }
                      est_minutes: { type: integer }
                  classes:
                    type: array
                    items:
                      type: object
                      required: [class, available, drivers, min_quote, max_quote, nearest_eta_min]
                      properties:
                        class: { $ref: "#/components/schemas/VehicleClass" }
                        available: { type: boolean }
                        drivers: { type: integer }
                        min_quote: { type: [integer, "null"] }
                        max_quote: { type: [integer, "null"] }
                        nearest_eta_min: { type: [integer, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationOrNotServed" }

  /rides:
    get:
      tags: [Rides]
      operationId: listMyRides
      x-jali-story: S4.6
      x-jali-permission: request-rides
      summary: My ride history (paginated)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Ride" }
                  next_page: { type: [integer, "null"] }
    post:
      tags: [Rides]
      operationId: requestRide
      x-jali-story: S3.4, S3.5
      x-jali-permission: request-rides
      summary: Request a ride from one driver (pick) or all nearby (broadcast)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TripPoints"
                - type: object
                  required: [mode]
                  properties:
                    mode: { type: string, enum: [pick, broadcast], description: "pick: one driver (driver_id required). broadcast: the nearest drivers within max_fare; first to accept wins at their own price (S3.5)" }
                    driver_id: { type: integer, description: "pick only: a driver from /rides/nearby" }
                    vehicle_class: { oneOf: [{ $ref: "#/components/schemas/VehicleClass" }, { type: "null" }], description: broadcast only }
                    max_fare: { type: [integer, "null"], minimum: 500, description: "broadcast only: only drivers whose total is at or under this" }
                    payment_method: { type: string, enum: [cash, momo], default: cash }
      responses:
        "201":
          description: Ride requested — price locked, driver notified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/ForbiddenOrPaused" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationOrNotServed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /rides/active:
    get:
      tags: [Rides]
      operationId: getActiveRide
      x-jali-story: S4.1
      summary: My current ride as rider or driver, or null (poll every few seconds during a trip)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Ride"
                  - type: "null"

  /rides/{id}:
    parameters:
      - $ref: "#/components/parameters/RideId"
    get:
      tags: [Rides]
      operationId: getRide
      x-jali-story: S4.1
      summary: Ride detail (rider or assigned driver only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ride" }
        "404": { $ref: "#/components/responses/NotFound" }

  /rides/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RideId"
    post:
      tags: [Rides]
      operationId: cancelRide
      x-jali-story: S4.3
      summary: Cancel as rider (requested/accepted/arrived) or driver (accepted/arrived)
      description: |
        Rider reasons: changed_plans, driver_too_far, driver_asked_to_cancel, found_other_transport, wrong_pickup, other.
        Driver reasons: rider_not_at_pickup, rider_asked_to_cancel, vehicle_problem, unsafe, traffic, other.
        A rider cancelling after the driver waited longer than free_wait_min pays cancel_fee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ride" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
