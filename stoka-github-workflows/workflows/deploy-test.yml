name: Deploy to Test Environment

# Trigger on push to develop branch
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: test_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to test.stoka.rw
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Create Frontend Environment File
        run: |
          cd frontend
          cat > .env.local << 'EOF'
          VITE_API_URL=https://test.stoka.rw/api
          VITE_API_TIMEOUT=30000
          VITE_APP_NAME=Inventory Management System (Test)
          VITE_APP_VERSION=1.0.0
          VITE_APP_ENV=test
          VITE_PWA_ENABLED=true
          VITE_PWA_CACHE_STRATEGY=NetworkFirst
          VITE_FEATURE_OFFLINE_SYNC=true
          VITE_FEATURE_PWA_INSTALL=true
          VITE_FEATURE_ANALYTICS=true
          VITE_DEBUG_MODE=true
          VITE_LOG_LEVEL=info
          VITE_ENABLE_DEVTOOLS=false
          VITE_AUTH_TOKEN_KEY=sessionToken
          VITE_AUTH_REFRESH_KEY=refreshToken
          VITE_AUTH_EXPIRY_KEY=tokenExpiry
          VITE_STORAGE_PREFIX=inventory_test_
          VITE_TENANT_KEY=tenantId
          VITE_USER_KEY=userData
          VITE_PAYMENT_GATEWAY_URL=https://test.stoka.rw/payment
          VITE_NOTIFICATION_SERVICE_URL=https://test.stoka.rw/notifications
          VITE_FILE_UPLOAD_URL=https://test.stoka.rw/api/upload
          VITE_CACHE_TTL=1800000
          VITE_CACHE_MAX_SIZE=100
          VITE_THEME_DEFAULT=light
          VITE_LANGUAGE_DEFAULT=en
          VITE_CURRENCY_DEFAULT=USD
          VITE_TEST_MODE=true
          VITE_MOCK_API=false
          VITE_TEST_DATA_ENABLED=true
          EOF

      - name: Build Frontend
        env:
          VITE_API_URL: https://test.stoka.rw/api
          VITE_API_TIMEOUT: 30000
          VITE_APP_NAME: Inventory Management System (Test)
          VITE_APP_VERSION: 1.0.0
          VITE_APP_ENV: test
          VITE_PWA_ENABLED: true
          VITE_PWA_CACHE_STRATEGY: NetworkFirst
          VITE_FEATURE_OFFLINE_SYNC: true
          VITE_FEATURE_PWA_INSTALL: true
          VITE_FEATURE_ANALYTICS: true
          VITE_DEBUG_MODE: true
          VITE_LOG_LEVEL: info
          VITE_ENABLE_DEVTOOLS: false
          VITE_AUTH_TOKEN_KEY: sessionToken
          VITE_AUTH_REFRESH_KEY: refreshToken
          VITE_AUTH_EXPIRY_KEY: tokenExpiry
          VITE_STORAGE_PREFIX: inventory_test_
          VITE_TENANT_KEY: tenantId
          VITE_USER_KEY: userData
          VITE_PAYMENT_GATEWAY_URL: https://test.stoka.rw/payment
          VITE_NOTIFICATION_SERVICE_URL: https://test.stoka.rw/notifications
          VITE_FILE_UPLOAD_URL: https://test.stoka.rw/api/upload
          VITE_CACHE_TTL: 1800000
          VITE_CACHE_MAX_SIZE: 100
          VITE_THEME_DEFAULT: light
          VITE_LANGUAGE_DEFAULT: en
          VITE_CURRENCY_DEFAULT: USD
          VITE_TEST_MODE: true
          VITE_MOCK_API: false
          VITE_TEST_DATA_ENABLED: true
        run: |
          cd frontend
          npm install -g npm@latest
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Copy Built Frontend
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT || 22 }}
          key: ${{ secrets.SSHKEY }}
          source: "frontend/build/*"
          target: "~/test.stoka.rw/build/"
          strip_components: 2
          overwrite: true
          rm: true

      - name: Deploy to test server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT || 22 }}
          key: ${{ secrets.SSHKEY }}
          script: |
            cd ~/test.stoka.rw
            git fetch origin develop
            git reset --hard origin/develop
            cd backend && php artisan config:clear || true
            cd .. && ./.scripts/deploy-test.sh
      - name: Deployment Status
        if: success()
        run: echo "✅ Test deployment successful! Site available at https://test.stoka.rw"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Test deployment failed. Check logs for details."
