name: Deploy Backend to Production

# Trigger on push to main branch
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: backend_production_deployment
  cancel-in-progress: false

jobs:
  test:
    name: Test before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath
          coverage: none
      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run test suite
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  deploy:
    name: Deploy Backend to jali.stoka.rw
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Create backend .env file
        working-directory: backend
        run: |
          cat > .env << EOF
          APP_NAME=Jali
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://jali.stoka.rw
          APP_TIMEZONE=Africa/Kigali

          LOG_CHANNEL=stack
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=seba_jali
          DB_USERNAME=seba_jali
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          FIREBASE_CREDENTIALS=storage/app/firebase-credentials.json

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync

          MAIL_MAILER=log
          MAIL_LOG_CHANNEL=stack
          EOF

      # One SSH connection per attempt: the server drops bursts of new connections,
      # which broke appleboy/scp-action (it opens a connection per step). The archive
      # is streamed over stdin, extracted in place, then migrations and caches run in
      # the same session. Re-running is safe (extract + migrate are idempotent).
      - name: Package backend
        run: tar -czf "$RUNNER_TEMP/backend.tgz" -C backend .

      - name: Upload, extract and migrate (single SSH session, retried)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.SSH_DEPLOY_PATH }}
        run: |
          set -u
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i $HOME/.ssh/deploy_key -p 25552 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 -o BatchMode=yes"
          REMOTE="set -e
            mkdir -p '$DEPLOY_PATH/backend'
            cd '$DEPLOY_PATH/backend'
            tar -xzf - --no-same-owner
            chmod -R 755 storage bootstrap/cache
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            echo \"Live release: ${GITHUB_SHA}\""
          for attempt in 1 2 3 4 5; do
            echo "Deploy attempt $attempt"
            if ssh $SSH_OPTS "$SSH_USERNAME@$SSH_HOST" "$REMOTE" < "$RUNNER_TEMP/backend.tgz"; then
              echo "Deployed ${GITHUB_SHA}"
              exit 0
            fi
            sleep $((attempt * 30))
          done
          echo "All deploy attempts failed" >&2
          exit 1

      - name: Deployment Status
        if: success()
        run: echo "✅ Backend deployment successful! API available at https://jali.stoka.rw"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Backend deployment failed. Check logs for details."
