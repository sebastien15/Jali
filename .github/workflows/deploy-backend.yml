name: Deploy Backend to Production

# Trigger on push to main branch
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: backend_production_deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Backend to jali.stoka.rw
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, mysql, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer dependencies
        working-directory: backend
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Create backend .env file
        working-directory: backend
        run: |
          cat > .env << EOF
          APP_NAME=Jali
          APP_ENV=production
          APP_KEY=${{ secrets.APP_KEY }}
          APP_DEBUG=false
          APP_URL=https://jali.stoka.rw
          APP_TIMEZONE=Africa/Kigali

          LOG_CHANNEL=stack
          LOG_LEVEL=error

          DB_CONNECTION=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=seba_jali
          DB_USERNAME=seba_jali
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}

          FIREBASE_CREDENTIALS=storage/app/firebase-credentials.json

          CACHE_DRIVER=file
          SESSION_DRIVER=file
          QUEUE_CONNECTION=sync

          MAIL_MAILER=log
          MAIL_LOG_CHANNEL=stack
          EOF

      - name: Deploy to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/*"
          target: ${{ secrets.SSH_DEPLOY_PATH }}/backend
          strip_components: 1
          overwrite: true

      - name: Run remote post-deploy steps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SSH_DEPLOY_PATH }}/backend
            chmod -R 755 storage bootstrap/cache
            php artisan key:generate --force || true
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      - name: Deployment Status
        if: success()
        run: echo "✅ Backend deployment successful! API available at https://jali.stoka.rw"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Backend deployment failed. Check logs for details."
