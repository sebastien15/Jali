name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: gradle-

      - name: Cache Metro bundler
        uses: actions/cache@v4
        with:
          path: mobile/node_modules/.cache
          key: metro-${{ hashFiles('mobile/package-lock.json') }}
          restore-keys: metro-

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Set API URL for build
        working-directory: mobile
        run: cp .env.production .env

      - name: Expo prebuild (generate Android project)
        working-directory: mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Set up release keystore and limit ABI to arm64-v8a
        # Expo prebuild generates a release signing config that defaults to debug.keystore
        # with standard Android debug credentials (alias=androiddebugkey, password=android).
        # Writing our keystore AS debug.keystore ensures it is always picked up — no
        # build.gradle patching needed. The SHA-1 of this file must match Firebase Console.
        # arm64-v8a covers all modern Android phones — see BUILDING.md for ABI reference.
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/app/debug.keystore
          echo "reactNativeArchitectures=arm64-v8a" >> mobile/android/gradle.properties

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jali-release-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
